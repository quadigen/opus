<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kinemium review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f7;
  --panel: #ffffff;
  --text: #17171a;
  --muted: #6b6b73;
  --line: #e3e3e7;
  --soft: #f0f0f2;
  --ok: #157347;
  --bad: #b42318;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f11;
    --panel: #17171a;
    --text: #f2f2f3;
    --muted: #9a9aa3;
    --line: #2a2a30;
    --soft: #202026;
    --ok: #3fb950;
    --bad: #f85149;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 760px; margin: 0 auto; padding: 40px 20px 72px; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -0.02em; }
.subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 550; }
input, textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  padding: 9px 11px;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--text); outline-offset: 1px; border-color: transparent; }
textarea { resize: vertical; min-height: 76px; }
textarea.invalid { border-color: var(--bad); }
.field { margin-bottom: 14px; }
button {
  border: 1px solid transparent;
  border-radius: 8px;
  font: inherit;
  font-weight: 550;
  padding: 8px 13px;
  cursor: pointer;
  background: var(--soft);
  color: var(--text);
}
button:hover { filter: brightness(0.97); }
button:disabled { opacity: 0.55; cursor: default; }
button.primary { background: var(--text); color: var(--panel); }
button.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
button.approve { background: var(--ok); color: #fff; }
button.reject { background: transparent; border-color: var(--line); color: var(--bad); }
button.danger { background: var(--bad); color: #fff; }
.error { margin: 0 0 14px; color: var(--bad); font-size: 14px; }
.tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted); padding: 8px 10px; margin-bottom: -1px; }
.tab:hover { filter: none; color: var(--text); }
.tab.active { border-bottom-color: var(--text); color: var(--text); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.filters { display: flex; gap: 8px; flex: 1; min-width: 0; }
.filters input { flex: 1; min-width: 0; }
.filters select { width: auto; }
.count { color: var(--muted); font-size: 13px; }
.badge { border-radius: 999px; font-size: 11px; font-weight: 600; padding: 2px 8px; text-transform: capitalize; }
.badge.pending { background: color-mix(in srgb, #d29922 18%, transparent); color: #9a6700; }
.badge.approved { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.badge.rejected { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
@media (prefers-color-scheme: dark) {
  .badge.pending { color: #d29922; }
}
.manage-row { display: flex; align-items: center; gap: 12px; }
.manage-main { flex: 1; min-width: 0; }
.manage-actions { display: flex; gap: 8px; flex: none; }
.manage-card .icon-wrap { width: 40px; height: 40px; border-radius: 9px; }
.edit-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.edit-grid .field { margin-bottom: 12px; }
.check { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; color: var(--text); font-size: 14px; }
.check input { width: auto; }
.edit-actions { display: flex; gap: 8px; }
.advanced { margin: 4px 0 14px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.advanced summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
.advanced[open] summary { margin-bottom: 12px; }
.versions-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.version-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.version-row:last-of-type { border-bottom: 0; }
.version-main { flex: 1; min-width: 0; }
.version-actions { display: flex; gap: 6px; flex: none; flex-wrap: wrap; }
.version-form { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.version-form .edit-grid { margin-bottom: 4px; }
.media-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.media-actions input[type="file"] { max-width: 260px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.card-body { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
.icon-wrap { width: 48px; height: 48px; flex: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--soft); }
.icon { display: block; width: 100%; height: 100%; object-fit: cover; }
.icon-fallback { display: grid; place-items: center; width: 100%; height: 100%; color: var(--muted); font-size: 18px; font-weight: 650; text-transform: uppercase; }
.banner { display: block; width: 100%; height: 150px; object-fit: cover; background: var(--soft); border-bottom: 1px solid var(--line); }
.title-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
.repo { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.version { color: var(--muted); font-size: 12px; white-space: nowrap; }
.byline { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.time { color: var(--muted); font-size: 12px; white-space: nowrap; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 20px; margin: 16px 0 0; }
.meta dt { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.meta dd { margin: 2px 0 0; font-size: 13px; overflow-wrap: anywhere; }
.meta a { color: inherit; text-underline-offset: 2px; }
.description { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.tag { background: var(--soft); border-radius: 999px; color: var(--muted); font-size: 11px; padding: 2px 8px; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.reject-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.reject-actions { display: flex; gap: 8px; margin-top: 10px; }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--muted); }
.more { display: flex; justify-content: center; margin-top: 16px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  max-width: calc(100vw - 40px);
  background: var(--text);
  color: var(--bg);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
}
@media (max-width: 560px) {
  main { padding-top: 26px; }
  header { flex-direction: column; }
  .card-head { align-items: flex-start; flex-direction: column; gap: 8px; }
  .edit-grid { grid-template-columns: 1fr; gap: 0; }
  .manage-row { align-items: flex-start; flex-wrap: wrap; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Package review</h1>
      <p class="subtitle">Approve packages and new versions before they appear publicly.</p>
    </div>
    <button id="logout" class="ghost" hidden>Sign out</button>
  </header>

  <section id="login" class="panel">
    <form id="login-form">
      <p id="login-error" class="error" hidden></p>
      <div class="field">
        <label for="user">Matrix user</label>
        <input id="user" name="user" autocomplete="username" placeholder="@devcell:quadigen.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="login-button" class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <section id="app" hidden>
    <nav class="tabs" role="tablist">
      <button id="tab-review" class="tab active" role="tab" aria-selected="true">Packages</button>
      <button id="tab-versions" class="tab" role="tab" aria-selected="false">Versions</button>
      <button id="tab-packages" class="tab" role="tab" aria-selected="false">All packages</button>
    </nav>

    <section id="review-view">
      <div class="bar">
        <span id="count" class="count"></span>
        <button id="refresh" class="ghost">Refresh</button>
      </div>
      <div id="list"></div>
      <div class="more">
        <button id="more" class="ghost" hidden>Load more</button>
      </div>
    </section>

    <section id="versions-view" hidden>
      <div class="bar">
        <span id="versions-count" class="count"></span>
        <button id="versions-refresh" class="ghost">Refresh</button>
      </div>
      <div id="versions-list"></div>
      <div class="more">
        <button id="versions-more" class="ghost" hidden>Load more</button>
      </div>
    </section>

    <section id="packages-view" hidden>
      <div class="bar">
        <div class="filters">
          <input id="package-search" type="search" placeholder="Search packages" autocomplete="off">
          <select id="package-status" aria-label="Review status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <button id="packages-refresh" class="ghost">Refresh</button>
      </div>
      <div class="bar"><span id="packages-count" class="count"></span></div>
      <div id="packages-list"></div>
      <div class="more">
        <button id="packages-more" class="ghost" hidden>Load more</button>
      </div>
    </section>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
</main>
<script>
(() => {
  "use strict";

  const TOKEN_KEY = "kinemium.review.token";
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem(TOKEN_KEY);
  let packages = [];
  let nextCursor = null;
  let loading = false;
  let allPackages = [];
  let allCursor = null;
  let allLoaded = false;
  let allRequest = 0;
  let pendingVersions = [];
  let versionsCursor = null;
  let versionsLoaded = false;
  let versionsRequest = 0;
  let versionsLoading = false;
  let searchTimer = 0;
  let toastTimer = 0;

  class AuthError extends Error {}

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function formatTime(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  }

  function toast(message, bad) {
    const node = $("toast");
    node.textContent = message;
    node.style.background = bad ? "var(--bad)" : "var(--text)";
    node.style.color = bad ? "#fff" : "var(--bg)";
    node.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { node.hidden = true; }, 3200);
  }

  function showLogin(message) {
    $("app").hidden = true;
    $("logout").hidden = true;
    $("login").hidden = false;
    const error = $("login-error");
    error.textContent = message || "";
    error.hidden = !message;
    $("user").focus();
  }

  function showApp() {
    $("login").hidden = true;
    $("app").hidden = false;
    $("logout").hidden = false;
  }

  function signOut(message) {
    token = null;
    sessionStorage.removeItem(TOKEN_KEY);
    packages = [];
    nextCursor = null;
    allPackages = [];
    allCursor = null;
    allLoaded = false;
    allRequest += 1;
    pendingVersions = [];
    versionsCursor = null;
    versionsLoaded = false;
    versionsRequest += 1;
    versionsLoading = false;
    loading = false;
    $("refresh").disabled = false;
    $("more").disabled = false;
    $("packages-refresh").disabled = false;
    $("packages-more").disabled = false;
    $("versions-refresh").disabled = false;
    $("versions-more").disabled = false;
    $("package-search").value = "";
    $("package-status").value = "all";
    showView("review");
    render();
    renderVersions();
    renderAll();
    showLogin(message);
  }

  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});
    headers.set("Authorization", "Bearer " + token);
    let body = options.body;
    if (body instanceof FormData) {
      // Let the browser set the multipart boundary.
    } else if (body && typeof body !== "string") {
      body = JSON.stringify(body);
      headers.set("Content-Type", "application/json");
    }
    const response = await fetch("/_kinemium/v1" + path, { ...options, headers, body });
    let data = {};
    try { data = await response.json(); } catch (error) { data = {}; }
    if (response.status === 401 || response.status === 403) {
      signOut(response.status === 403
        ? "This account is not a Matrix server administrator."
        : "Your session expired. Sign in again.");
      throw new AuthError();
    }
    if (!response.ok) {
      throw new Error(data.error || "Request failed (" + response.status + ").");
    }
    return data;
  }

  function render() {
    const list = $("list");
    list.replaceChildren();
    $("count").textContent = packages.length === 0
      ? "No pending packages"
      : packages.length + (packages.length === 1 ? " pending package" : " pending packages");
    if (packages.length === 0) {
      list.append(element("div", "empty", "Nothing to review."));
    } else {
      for (const pkg of packages) list.append(card(pkg));
    }
    $("more").hidden = !nextCursor;
  }

  function renderVersions() {
    const list = $("versions-list");
    list.replaceChildren();
    $("versions-count").textContent = pendingVersions.length === 0
      ? "No pending versions"
      : pendingVersions.length +
        (pendingVersions.length === 1 ? " pending version" : " pending versions");
    if (pendingVersions.length === 0) {
      list.append(element("div", "empty", "No versions awaiting review."));
    } else {
      for (const version of pendingVersions) list.append(versionReviewCard(version));
    }
    $("versions-more").hidden = !versionsCursor;
  }

  function renderAll() {
    const list = $("packages-list");
    list.replaceChildren();
    $("packages-count").textContent = allPackages.length === 0
      ? "No packages"
      : allPackages.length + (allPackages.length === 1 ? " package" : " packages");
    if (allPackages.length === 0) {
      list.append(element("div", "empty", "No packages found."));
    } else {
      for (const pkg of allPackages) list.append(adminCard(pkg));
    }
    $("packages-more").hidden = !allCursor;
  }

  let controlId = 0;

  function field(labelText, control) {
    controlId += 1;
    const id = "admin-field-" + controlId;
    control.id = id;
    const wrapper = element("div", "field");
    const label = element("label", "", labelText);
    label.htmlFor = id;
    wrapper.append(label, control);
    return wrapper;
  }

  function packagePath(pkg) {
    return "/admin/packages/" + encodeURIComponent(pkg.namespace) + "/" +
      encodeURIComponent(pkg.name);
  }

  function packageAssetPath(pkg, asset) {
    return "/packages/" + encodeURIComponent(pkg.namespace) + "/" +
      encodeURIComponent(pkg.name) + "/" + asset;
  }

  function versionDownloadPath(pkg, version) {
    return "/packages/" + encodeURIComponent(pkg.namespace) + "/" +
      encodeURIComponent(pkg.name) + "/versions/" +
      encodeURIComponent(version) + "/download";
  }

  function versionApiPath(pkg, version) {
    return packagePath(pkg) + "/versions/" + encodeURIComponent(version);
  }

  function localDateTime(ms) {
    if (!ms) return "";
    const date = new Date(ms);
    if (Number.isNaN(date.getTime())) return "";
    const pad = (value) => String(value).padStart(2, "0");
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" +
      pad(date.getDate()) + "T" + pad(date.getHours()) + ":" +
      pad(date.getMinutes());
  }

  function timestampFromInput(value) {
    if (!value) return null;
    const parsed = new Date(value).getTime();
    return Number.isNaN(parsed) ? null : parsed;
  }

  function formatSize(bytes) {
    if (!bytes) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function downloadFilename(header, pkg) {
    const encoded = /filename\*=UTF-8''([^;]+)/i.exec(header || "");
    if (encoded) {
      try { return decodeURIComponent(encoded[1]); } catch (error) { /* ignore */ }
    }
    const plain = /filename="?([^";]+)"?/i.exec(header || "");
    if (plain) return plain[1];
    return pkg.name + "-" + pkg.latestVersion;
  }

  function downloadPackage(pkg, button) {
    if (!pkg.latestVersion) return;
    return downloadVersion(pkg, pkg.latestVersion, button);
  }

  async function uploadPackageImage(pkg, asset, fileInput, button) {
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
      toast("Choose an image first.", true);
      return;
    }
    const original = button.textContent;
    button.disabled = true;
    button.textContent = "Uploading…";
    try {
      const form = new FormData();
      form.append("file", file);
      const data = await api(packageAssetPath(pkg, asset), {
        method: "POST",
        body: form
      });
      if (data && data.package) syncPackage(data.package);
      renderAll();
      toast("Updated " + asset);
    } catch (error) {
      if (!(error instanceof AuthError)) toast(error.message, true);
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  }

  async function downloadVersion(pkg, version, button) {
    if (!version) return;
    const original = button.textContent;
    button.disabled = true;
    button.textContent = "Downloading…";
    try {
      const response = await fetch("/_kinemium/v1" + versionDownloadPath(pkg, version), {
        headers: { Authorization: "Bearer " + token }
      });
      if (response.status === 401 || response.status === 403) {
        signOut(response.status === 403
          ? "This account is not a Matrix server administrator."
          : "Your session expired. Sign in again.");
        throw new AuthError();
      }
      if (!response.ok) {
        let data = {};
        try { data = await response.json(); } catch (error) { data = {}; }
        throw new Error(data.error || "Download failed (" + response.status + ").");
      }
      const blob = await response.blob();
      const filename = downloadFilename(
        response.headers.get("Content-Disposition"), { ...pkg, latestVersion: version }
      );
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast("Downloaded " + filename);
    } catch (error) {
      if (!(error instanceof AuthError)) toast(error.message, true);
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  }

  async function loadVersions(pkg, panel) {
    panel.replaceChildren(element("div", "empty", "Loading versions…"));
    try {
      const data = await api(packagePath(pkg) + "/versions");
      if (data.package) syncPackage(data.package);
      const versions = Array.isArray(data.versions) ? data.versions : [];
      const latest = versions.find((version) => !version.yanked);
      pkg.latestVersion = latest ? latest.version : null;
      const head = element("div", "bar");
      head.append(
        element("span", "count", versions.length +
          (versions.length === 1 ? " version" : " versions")),
        element("span", "count", "Latest: " + (pkg.latestVersion || "none"))
      );
      panel.replaceChildren(head);

      if (versions.length === 0) {
        panel.append(element("div", "empty", "No versions yet."));
      }
      for (const version of versions) {
        const row = element("div", "version-row");
        const main = element("div", "version-main");
        const title = element("div", "title-row");
        title.append(element("span", "repo", "v" + version.version));
        if (version.reviewStatus && version.reviewStatus !== "approved") {
          title.append(
            element("span", "badge " + version.reviewStatus, version.reviewStatus)
          );
        }
        if (version.yanked) title.append(element("span", "badge rejected", "yanked"));
        main.append(title);
        main.append(element(
          "div",
          "byline",
          formatSize(version.size) + " · published " +
            formatTime(version.publishedAt) +
            (version.engineConstraint ? " · " + version.engineConstraint : "")
        ));
        const actions = element("div", "version-actions");
        const download = element("button", "ghost", "Download");
        const yank = element("button", "ghost", version.yanked ? "Restore" : "Yank");
        const remove = element("button", "reject", "Delete");
        actions.append(download, yank, remove);
        row.append(main, actions);
        panel.append(row);

        download.addEventListener("click", () => {
          downloadVersion(pkg, version.version, download);
        });
        yank.addEventListener("click", async () => {
          yank.disabled = true;
          try {
            await api(versionApiPath(pkg, version.version), {
              method: "PATCH",
              body: { yanked: !version.yanked }
            });
            toast((version.yanked ? "Restored " : "Yanked ") + version.version);
            await loadVersions(pkg, panel);
          } catch (error) {
            if (!(error instanceof AuthError)) toast(error.message, true);
            yank.disabled = false;
          }
        });

        let armed = false;
        const reset = () => {
          armed = false;
          remove.textContent = "Delete";
          remove.disabled = false;
        };
        remove.addEventListener("blur", () => {
          if (armed && !remove.disabled) reset();
        });
        remove.addEventListener("click", async () => {
          if (!armed) {
            armed = true;
            remove.textContent = "Confirm delete";
            remove.focus();
            return;
          }
          remove.disabled = true;

  async function mediaObjectUrl(mxc, width, height) {
    const match = /^mxc:\/\/([^/]+)\/(.+)$/.exec(mxc || "");
    if (!match) return null;
    const server = encodeURIComponent(match[1]);
    const media = encodeURIComponent(match[2]);
    const headers = { Authorization: "Bearer " + token };
    try {
      const thumbnail = await fetch(
        "/_matrix/client/v1/media/thumbnail/" + server + "/" + media +
        "?width=" + width + "&height=" + height + "&method=scale",
        { headers }
      );
      if (thumbnail.ok) return URL.createObjectURL(await thumbnail.blob());
      const download = await fetch(
        "/_matrix/client/v1/media/download/" + server + "/" + media,
        { headers }
      );
      if (download.ok) return URL.createObjectURL(await download.blob());
    } catch (error) {
      return null;
    }
    return null;
  }

  function setImage(container, mxc, className, alt, width, height, fallback) {
    if (!mxc) {
      if (fallback) container.append(element("span", "icon-fallback", fallback));
      return;
    }
    mediaObjectUrl(mxc, width, height).then((url) => {
      if (!url) {
        if (fallback) container.append(element("span", "icon-fallback", fallback));
        return;
      }
      const image = element("img", className);
      image.alt = alt;
      image.loading = "lazy";
      image.addEventListener("load", () => URL.revokeObjectURL(url), { once: true });
      image.src = url;
      container.replaceChildren(image);
    });
  }

  async function loadVersions(reset) {
    if (versionsLoading) return;
    versionsLoading = true;
    const request = ++versionsRequest;
    $("versions-refresh").disabled = true;
    $("versions-more").disabled = true;
    try {
      const params = new URLSearchParams({ limit: "50" });
      if (reset) versionsCursor = null;
      if (!reset && versionsCursor) params.set("cursor", versionsCursor);
      const data = await api("/admin/package-versions?" + params.toString());
      if (request !== versionsRequest) return;
      const incoming = Array.isArray(data.versions) ? data.versions : [];
      if (reset) pendingVersions = [];
      const seen = new Set(
        pendingVersions.map((item) => (item.package ? item.package.packageId : "") + "/" + item.version)
      );
      for (const version of incoming) {
        const key = (version.package ? version.package.packageId : "") + "/" + version.version;
        if (!seen.has(key)) {
          pendingVersions.push(version);
          seen.add(key);
        }
      }
      versionsCursor = typeof data.nextCursor === "string" ? data.nextCursor : null;
      versionsLoaded = true;
      renderVersions();
    } catch (error) {
      if (!(error instanceof AuthError)) toast(error.message, true);
    } finally {
      if (request === versionsRequest) {
        versionsLoading = false;
        $("versions-refresh").disabled = false;
        $("versions-more").disabled = false;
      }
    }
  }

  async function loadAll(reset) {
    const request = ++allRequest;
    $("packages-refresh").disabled = true;
    $("packages-more").disabled = true;
    try {
      const params = new URLSearchParams({ limit: "50" });
      if (reset) allCursor = null;
      const search = $("package-search").value.trim();
      const status = $("package-status").value;
      if (search) params.set("q", search);
      if (status && status !== "all") params.set("status", status);
      if (!reset && allCursor) params.set("cursor", allCursor);
      const data = await api("/admin/packages?" + params.toString());
      if (request !== allRequest) return;
      const incoming = Array.isArray(data.packages) ? data.packages : [];
      if (reset) allPackages = [];
      const seen = new Set(allPackages.map((item) => item.packageId));
      for (const pkg of incoming) {
        if (!seen.has(pkg.packageId)) allPackages.push(pkg);
      }
      allCursor = typeof data.nextCursor === "string" ? data.nextCursor : null;
      allLoaded = true;
      renderAll();
    } catch (error) {
      if (!(error instanceof AuthError)) toast(error.message, true);
    } finally {
      if (request === allRequest) {
        $("packages-refresh").disabled = false;
        $("packages-more").disabled = false;
      }
    }
  }

  async function load(reset) {
    if (loading) return;
    loading = true;
    $("refresh").disabled = true;
    $("more").disabled = true;
    try {
      const params = new URLSearchParams({ limit: "50" });
      if (!reset && nextCursor) params.set("cursor", nextCursor);
      const data = await api("/packages/toreview?" + params.toString());
      const incoming = Array.isArray(data.packages) ? data.packages : [];
      if (reset) packages = [];
      const seen = new Set(packages.map((item) => item.packageId));
      for (const pkg of incoming) {
        if (!seen.has(pkg.packageId)) packages.push(pkg);
      }
      nextCursor = typeof data.nextCursor === "string" ? data.nextCursor : null;
      render();
    } catch (error) {
      if (!(error instanceof AuthError)) toast(error.message, true);
    } finally {
      loading = false;
      $("refresh").disabled = false;
      $("more").disabled = false;
    }
  }

  $("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = $("login-error");
    const button = $("login-button");
    error.hidden = true;
    button.disabled = true;
    button.textContent = "Signing in…";
    try {
      const response = await fetch("/_matrix/client/v3/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: "m.login.password",
          identifier: { type: "m.id.user", user: $("user").value.trim() },
          password: $("password").value,
          initial_device_display_name: "Kinemium review"
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || typeof data.access_token !== "string") {
        throw new Error(data.error || "Sign-in failed.");
      }
      token = data.access_token;
      sessionStorage.setItem(TOKEN_KEY, token);
      $("password").value = "";
      showApp();
      await load(true);
    } catch (failure) {
      error.textContent = failure.message;
      error.hidden = false;
    } finally {
      button.disabled = false;
      button.textContent = "Sign in";
    }
  });

  $("logout").addEventListener("click", () => signOut());
  $("refresh").addEventListener("click", () => load(true));
  $("more").addEventListener("click", () => load(false));
  $("packages-refresh").addEventListener("click", () => loadAll(true));
  $("packages-more").addEventListener("click", () => loadAll(false));
  $("versions-refresh").addEventListener("click", () => loadVersions(true));
  $("versions-more").addEventListener("click", () => loadVersions(false));
  $("tab-review").addEventListener("click", () => showView("review"));
  $("tab-versions").addEventListener("click", () => showView("versions"));
  $("tab-packages").addEventListener("click", () => showView("packages"));
  $("package-status").addEventListener("change", () => loadAll(true));
  $("package-search").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = window.setTimeout(() => loadAll(true), 250);
  });

  if (token) {
    showApp();
    load(true);
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
